
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WeatherNow | Live Weather App</title>
    <meta name="description" content="Check current weather conditions, temperature, humidity, and wind speed for any city.">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="weather-app">
        <p class="app-label">WEATHER DASHBOARD</p>

        <h1>WeatherNow</h1>
        <p class="subtitle">Discover the weather in your city.</p>

        <form id="searchForm" class="search-box">
            <label for="cityInput">Enter city name</label>

            <div class="search-row">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="e.g. Delhi, Mumbai, London"
                    required
                >

                <button type="submit" id="searchButton">
                    Search
                </button>
            </div>
        </form>

        <p id="status" role="status" aria-live="polite">
            Search for a city to see its weather.
        </p>

        <section id="weatherResult" class="weather-result" hidden>
            <div class="weather-heading">
                <div>
                    <h2 id="cityName">City</h2>
                    <p id="countryName">Country</p>
                </div>

                <span id="weatherIcon" class="weather-icon"
                      aria-hidden="true">☀️</span>
            </div>

            <p id="condition" class="condition">Clear sky</p>

            <p class="temperature">
                <span id="temperature">--</span><span>°C</span>
            </p>

            <p id="feelsLike" class="feels-like"></p>

            <div class="weather-details">
                <article class="detail-card">
                    <span aria-hidden="true">💧</span>
                    <h3>Humidity</h3>
                    <p><span id="humidity">--</span>%</p>
                </article>

                <article class="detail-card">
                    <span aria-hidden="true">🌬️</span>
                    <h3>Wind Speed</h3>
                    <p><span id="wind">--</span> km/h</p>
                </article>
            </div>

            <p id="updatedTime" class="updated-time"></p>
        </section>

        <footer>
            Weather data provided by
            <a href="https://open-meteo.com/"
               target="_blank"
               rel="noopener noreferrer">Open-Meteo</a>
        </footer>
    </main>

</body>
</html>
